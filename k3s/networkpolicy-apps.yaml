# Only allow ingress to apps-namespace pods from the Pomerium pod in infra.
# Everything else (direct pod/service access) is denied — proxy bypass blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: only-from-pomerium
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pomerium

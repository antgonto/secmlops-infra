---
# Pinned toolchain for the self-hosted runner/agent host. Bump deliberately; re-run `make provision`.
tool_versions:
  trivy: "0.74.0"
  gitleaks: "8.30.1"
  cosign: "3.1.3"
  syft: "1.52.0"
  grype: "0.119.0"
  kubectl: "1.31.1"
  helm: "3.16.1"
  kyverno_cli: "1.19.1"
  hadolint: "2.15.1"
  actionlint: "1.7.12"
  nuclei: "3.11.1"
  katana: "1.7.0"
  yq: "4.53.6"
  gitlab_runner: "17.4.0"
  github_runner: "2.337.0"
  opengrep: "1.30.0"
  opentofu: "1.12.6"
# Architecture-aware download names. `arch` is amd64 on x86 hosts and arm64 on Apple Silicon (VirtualBox 7.1+ / VMware Fusion).
arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"
arch_names:                      # per-project spelling of the architecture in release asset names
  trivy:     { amd64: "Linux-64bit",  arm64: "Linux-ARM64" }
  gitleaks:  { amd64: "linux_x64",    arm64: "linux_arm64" }
  hadolint:  { amd64: "Linux-x86_64", arm64: "Linux-arm64" }
  kyverno:   { amd64: "linux_x86_64", arm64: "linux_arm64" }
  opengrep:  { amd64: "manylinux_x86", arm64: "manylinux_aarch64" }
  ghrunner:  { amd64: "linux-x64",    arm64: "linux-arm64" }
go_version: "1.23.1"
python_tools:            # installed system-wide with pip (runner jobs use the app's own requirements.txt too)
  - "modelscan==0.8.8"
  - "picklescan==1.0.5"
  - "dvc[s3]==3.67.1"
  - "mlflow==3.16.1"
  - "adversarial-robustness-toolbox==1.20.1"
  - "giskard==3.0.0"
  - "pandera==0.33.1"
  - "safetensors==0.8.0"
  - "cyclonedx-bom==7.4.0"
  - "garak==0.17.0"
  - "ruff==0.16.8"
  - "mypy==2.3.1"
  - "pytest==9.1.1"
  - "zizmor==1.30.1"
  - "pywinrm==0.5.0"          # Ansible → Windows VM over WinRM
  - "awscli==1.46.1"
runner_user: azagent      # shared by the ADO agent, GitLab runner, GitHub runner

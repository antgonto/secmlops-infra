---
- name: Enable amd64 emulation on arm64 hosts (Harbor images are amd64-only)
  ansible.builtin.command: docker run --privileged --rm tonistiigi/binfmt --install amd64
  when: ansible_architecture in ["aarch64", "arm64"]
  changed_when: true
  args: { creates: /proc/sys/fs/binfmt_misc/qemu-x86_64 }

# Automated Harbor install. Admin password is generated and stored in OpenBao
# (bootstrap role seeds it first), so no secret is baked into the repo.
- name: Check if Harbor is already installed
  ansible.builtin.stat:
    path: "{{ stacks_root }}/harbor/docker-compose.yml"
  register: harbor_installed

- name: Download Harbor online installer
  ansible.builtin.get_url:
    url: "https://github.com/goharbor/harbor/releases/download/{{ harbor_version }}/harbor-online-installer-{{ harbor_version }}.tgz"
    dest: /tmp/harbor-installer.tgz
    mode: "0644"
  when: not harbor_installed.stat.exists

- name: Unpack Harbor
  ansible.builtin.unarchive:
    src: /tmp/harbor-installer.tgz
    dest: "{{ stacks_root }}"
    remote_src: true
    creates: "{{ stacks_root }}/harbor/install.sh"
  when: not harbor_installed.stat.exists

- name: Render harbor.yml
  ansible.builtin.template:
    src: harbor.yml.j2
    dest: "{{ stacks_root }}/harbor/harbor.yml"
    mode: "0640"
  when: not harbor_installed.stat.exists

- name: Run Harbor installer (with Trivy scanner)
  ansible.builtin.command:
    cmd: ./install.sh --with-trivy
    chdir: "{{ stacks_root }}/harbor"
  when: not harbor_installed.stat.exists
  register: harbor_install
  changed_when: "'----Harbor has been installed' in harbor_install.stdout"

- name: Wait for Harbor API to become healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ harbor_http_port }}/api/v2.0/health"
    status_code: 200
  register: harbor_health
  until: harbor_health.status == 200
  retries: 30
  delay: 10

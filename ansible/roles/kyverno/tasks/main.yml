---
# Installs Kyverno into the staging cluster and applies the admission policies,
# substituting the Cosign public key generated by the bootstrap role.
- name: Install Kyverno via Helm into staging
  ansible.builtin.shell:
    cmd: >-
      k3s kubectl create namespace kyverno --dry-run=client -o yaml | k3s kubectl apply -f - &&
      k3s kubectl apply -f https://github.com/kyverno/kyverno/releases/download/{{ kyverno_version }}/install.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: kyverno_install
  changed_when: "'created' in kyverno_install.stdout"

- name: Wait for Kyverno to be ready
  ansible.builtin.command:
    cmd: k3s kubectl -n kyverno wait --for=condition=ready pod -l app.kubernetes.io/part-of=kyverno --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Render the verified-images policy with the real Cosign public key
  ansible.builtin.template:
    src: kyverno-verified-images.yaml.j2
    dest: "{{ stacks_root }}/kyverno-verified-images.yaml"
    mode: "0644"

- name: Apply network policy and Kyverno admission policy to staging
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f {{ item }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop:
    - /vagrant/k3s/networkpolicy-apps.yaml
    - "{{ stacks_root }}/kyverno-verified-images.yaml"
  register: policy_apply
  changed_when: "'created' in policy_apply.stdout or 'configured' in policy_apply.stdout"
